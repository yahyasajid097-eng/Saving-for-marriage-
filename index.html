<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<meta name="description" content="Salary and savings planner / مخطط الراتب والادخار / Planificateur de salaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Salary Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171717;--card:#06110C;--line:#22332b;--red:#A31C1B;--txt:#f2ede8;--mut:#a9a39d;--sand:#CDBFB4;--ok:#7fd1a8;--bad:#ff8a87}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Cairo,system-ui,Tahoma,Arial,sans-serif;line-height:1.7}
header{background:var(--card);border-bottom:3px solid var(--red);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:1.2rem}header p{margin:0;color:var(--mut);font-size:.82rem}
main{max-width:780px;margin:auto;padding:14px}
nav{display:flex;gap:6px;margin-bottom:14px}
button,input,select{font:inherit}button{min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
nav button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;padding:0 4px;font-size:.88rem}
nav button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:1rem;color:var(--sand)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
.g3{grid-template-columns:repeat(3,1fr)}.g3 .stat b{font-size:1.05rem}
.stat b{display:block;font-size:1.2rem}.stat span,.hero span{color:var(--mut);font-size:.8rem}
.hero{border-color:var(--red);background:linear-gradient(160deg,#06110C,#1d0e0e)}.hero .big{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero b{display:block;font-size:1.6rem;line-height:1.3}
.bar{height:14px;background:#262626;border-radius:9px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.8rem;color:var(--mut)}
.lg u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.warn{background:rgba(163,28,27,.28);border:1px solid var(--red);border-radius:10px;padding:10px;margin-bottom:12px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.w{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:660px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--red);color:#fff}
td.s{color:var(--ok);font-weight:700}tr.neg td.s{color:var(--bad)}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}tr.now td{background:rgba(205,191,180,.16)}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:2px}
input,select{width:100%;min-height:42px;padding:8px 10px;background:#101010;border:1px solid var(--line);border-radius:8px;color:var(--txt)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.btn{padding:8px 14px;border:0;border-radius:9px;background:var(--red);color:#fff}
.btn.g,.x{background:#222;color:var(--txt);border:1px solid var(--line)}.x{border-radius:8px;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--mut);font-size:.8rem;margin:8px 0 0}
.lang{background:#222;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:6px 12px}
.rl{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px}.rl b.ok{color:var(--ok)}.rl b.no{color:var(--bad)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
#wel{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#wel .card{max-width:420px;border-color:var(--red);text-align:center}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:18px}
@media print{header button,nav,#c,#wel,footer{display:none!important}section{display:block!important}body{background:#fff;color:#000}.card,.w{border-color:#ccc;background:#fff}}
</style>
</head>
<body>
<header><div><h1 data-i="title"></h1><p data-i="sub"></p></div><button class="lang" id="lg" aria-label="Language"></button></header>
<main>
<nav><button data-t="a" class="on" data-i="n1"></button><button data-t="b" data-i="n2"></button><button data-t="d" data-i="n4"></button><button data-t="c" data-i="n3"></button></nav>

<section id="a" class="on">
<div class="card hero" id="hero"></div>
<div id="rem"></div><div id="warn"></div>
<div class="card"><h2 data-i="prog"></h2><div class="bar"><i id="pg" style="background:var(--red);width:0"></i></div><p class="note" id="pgt"></p></div>
<div class="grid" id="stats"></div>
<div class="card" id="now"></div>
<div class="card"><h2 data-i="chart"></h2><svg id="ch" viewBox="0 0 300 130" width="100%" role="img"></svg></div>
<div class="card"><h2 data-i="split"></h2><div class="bar" id="split"></div><div class="lg" id="lgd"></div></div>
<div class="card"><h2 data-i="rule"></h2><div id="rule"></div><p class="note" data-i="ruleN"></p></div>
<div class="card" id="adv" style="display:none"></div>
<div class="card"><h2 data-i="wi"></h2><div class="row"><div><label data-i="wiSal"></label><input type="number" inputmode="decimal" id="wiS" value="0"></div><div><label data-i="wiMon"></label><input type="number" min="1" max="120" inputmode="numeric" id="wiM"></div></div><div id="wiR"></div></div>
</section>

<section id="b"><div class="w"><table><thead><tr id="th"></tr></thead><tbody id="rows"></tbody></table></div>
<p class="note" data-i="planNote"></p>
<div class="acts" style="margin-top:10px"><button class="btn g" id="csv" data-i="csv"></button><button class="btn g" id="pr" data-i="print"></button></div></section>

<section id="d">
<div class="card"><h2 data-i="trT"></h2><div id="trS"></div></div>
<div class="card"><div class="row"><div><label data-i="amt"></label><input type="number" min="0" inputmode="decimal" id="tA"></div><div><label data-i="name"></label><input type="text" id="tN"></div><div><label data-i="date"></label><input type="date" id="tD"></div><div style="display:flex;align-items:flex-end"><button class="btn" id="tB" style="width:100%" data-i="trAdd"></button></div></div><div id="trL"></div></div>
</section>

<section id="c">
<div class="card"><h2 data-i="basics"></h2><div class="row">
<div><label data-i="salary"></label><input type="number" min="0" inputmode="decimal" data-k="salary"></div>
<div><label data-i="target"></label><input type="number" min="0" inputmode="decimal" data-k="target"></div>
<div><label data-i="start"></label><input type="month" data-k="start"></div>
<div><label data-i="months"></label><input type="number" min="1" max="120" inputmode="numeric" data-k="months"></div>
<div><label data-i="cur"></label><input type="text" maxlength="6" data-k="cur"></div>
<div><label data-i="emg"></label><input type="number" min="0" max="12" inputmode="decimal" data-k="emgM"></div></div>
<p class="note" data-i="emgN"></p></div>
<div class="card"><h2 data-i="fixedT"></h2><div id="l-fixed"></div><button class="btn g" data-add="fixed" data-i="add"></button></div>
<div class="card"><h2 data-i="debtsT"></h2><div id="l-debts"></div><button class="btn g" data-add="debts" data-i="add"></button><p class="note" data-i="debtN"></p></div>
<div class="card"><h2 data-i="onceT"></h2><div id="l-once"></div><button class="btn g" data-add="once" data-i="add"></button></div>
<div class="card"><h2 data-i="goalsT"></h2><div id="l-goals"></div><button class="btn g" data-add="goals" data-i="add"></button><p class="note" data-i="goalN"></p></div>
<div class="card"><h2 data-i="incT"></h2><div id="l-inc"></div><button class="btn g" data-add="inc" data-i="add"></button></div>
<div class="card"><h2 data-i="remT"></h2><div class="row"><div><label data-i="remDay"></label><input type="number" min="1" max="28" inputmode="numeric" data-k="remDay"></div></div><div class="acts"><button class="btn g" id="ics" data-i="remIcs"></button><button class="btn g" id="ntf" data-i="remNtf"></button></div><p class="note" data-i="remN"></p></div>
<div class="card"><h2 data-i="data"></h2><div class="acts"><button class="btn" id="ex" data-i="backup"></button><button class="btn g" id="im" data-i="restore"></button><button class="btn g" id="rs" data-i="reset"></button></div><input type="file" id="fi" accept=".json" hidden><p class="note" data-i="auto"></p></div>
</section>
</main>
<footer data-i="foot"></footer>
<div id="wel"><div class="card"><h2 data-i="wt"></h2><p data-i="wx"></p><div class="acts" style="justify-content:center"><button class="btn" id="w1" data-i="w1"></button><button class="btn g" id="w2" data-i="w2"></button></div></div></div>
